<!-- ===== UNIFIED POINT CLOUD BACKGROUND (paste before </body>) ===== -->
<canvas id="pc-bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>

<div id="pc-controls" style="position:fixed;bottom:16px;left:16px;display:flex;gap:6px;flex-wrap:wrap;z-index:1000;max-width:calc(100% - 32px);">
  <button class="pc-btn" data-mode="network" style="background:rgba(0,255,170,0.08);border:1px solid rgba(0,255,170,0.35);color:#00ffaa;font-family:'Courier New',monospace;font-size:9px;padding:5px 9px;border-radius:4px;cursor:pointer;letter-spacing:0.5px;">NETWORK</button>
  <button class="pc-btn" data-mode="sphere" style="background:rgba(0,255,170,0.08);border:1px solid rgba(0,255,170,0.35);color:#00ffaa;font-family:'Courier New',monospace;font-size:9px;padding:5px 9px;border-radius:4px;cursor:pointer;letter-spacing:0.5px;">SPHERE</button>
  <button class="pc-btn" data-mode="wave" style="background:rgba(0,255,170,0.08);border:1px solid rgba(0,255,170,0.35);color:#00ffaa;font-family:'Courier New',monospace;font-size:9px;padding:5px 9px;border-radius:4px;cursor:pointer;letter-spacing:0.5px;">WAVE</button>
  <button class="pc-btn" data-mode="galaxy" style="background:rgba(0,255,170,0.08);border:1px solid rgba(0,255,170,0.35);color:#00ffaa;font-family:'Courier New',monospace;font-size:9px;padding:5px 9px;border-radius:4px;cursor:pointer;letter-spacing:0.5px;">GALAXY</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('pc-bg-canvas');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000005, 0.012);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 32);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const isMobile = window.innerWidth < 768;
  const MAX_COUNT = isMobile ? 3500 : 6000;

  const positions = new Float32Array(MAX_COUNT * 3);
  const basePositions = new Float32Array(MAX_COUNT * 3);
  const colors = new Float32Array(MAX_COUNT * 3);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: isMobile ? 0.18 : 0.22,
    vertexColors: true,
    transparent: true,
    opacity: 0.45,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const pointCloud = new THREE.Points(geometry, material);
  scene.add(pointCloud);

  const cyan = new THREE.Color(0x00ffaa);
  const teal = new THREE.Color(0x00aaff);

  let activeCount = MAX_COUNT;

  function buildNetwork() {
    activeCount = Math.min(900, MAX_COUNT);
    for (let i = 0; i < activeCount; i++) {
      basePositions[i*3] = (Math.random()-0.5) * 55;
      basePositions[i*3+1] = (Math.random()-0.5) * 40;
      basePositions[i*3+2] = (Math.random()-0.5) * 35;
      const c = cyan.clone().lerp(teal, Math.random());
      colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
    }
  }

  function buildSphere() {
    activeCount = MAX_COUNT;
    for (let i = 0; i < activeCount; i++) {
      const phi = Math.acos(-1 + (2 * i) / activeCount);
      const theta = Math.sqrt(activeCount * Math.PI) * phi;
      const r = 15;
      basePositions[i*3] = r * Math.cos(theta) * Math.sin(phi);
      basePositions[i*3+1] = r * Math.sin(theta) * Math.sin(phi);
      basePositions[i*3+2] = r * Math.cos(phi);
      const c = cyan.clone().lerp(teal, Math.random());
      colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
    }
  }

  function buildWave() {
    activeCount = MAX_COUNT;
    const side = Math.ceil(Math.sqrt(activeCount));
    for (let i = 0; i < activeCount; i++) {
      const x = (i % side) - side / 2;
      const z = Math.floor(i / side) - side / 2;
      const y = Math.sin(x * 0.3) * Math.cos(z * 0.3) * 4;
      basePositions[i*3] = x * 0.9;
      basePositions[i*3+1] = y;
      basePositions[i*3+2] = z * 0.9;
      const c = cyan.clone().lerp(teal, Math.random());
      colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
    }
  }

  function buildGalaxy() {
    activeCount = MAX_COUNT;
    const branches = 4;
    for (let i = 0; i < activeCount; i++) {
      const radius = Math.pow(Math.random(), 0.6) * 20;
      const branchAngle = ((i % branches) / branches) * Math.PI * 2;
      const spin = radius * 0.25;
      const spread = 0.4;
      basePositions[i*3] = Math.cos(branchAngle + spin) * radius + (Math.random()-0.5) * spread * radius;
      basePositions[i*3+1] = (Math.random()-0.5) * spread * 2;
      basePositions[i*3+2] = Math.sin(branchAngle + spin) * radius + (Math.random()-0.5) * spread * radius;
      const c = cyan.clone().lerp(teal, Math.random());
      colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
    }
  }

  const builders = { network: buildNetwork, sphere: buildSphere, wave: buildWave, galaxy: buildGalaxy };

  let morphFrom = new Float32Array(MAX_COUNT * 3);
  let morphProgress = 1;
  let currentMode = 'network';

  buildNetwork();
  positions.set(basePositions);

  function switchMode(name) {
    morphFrom.set(positions);
    builders[name]();
    for (let i = activeCount; i < MAX_COUNT; i++) {
      basePositions[i*3]=0; basePositions[i*3+1]=0; basePositions[i*3+2]=0;
      colors[i*3]=0; colors[i*3+1]=0; colors[i*3+2]=0;
    }
    geometry.attributes.color.needsUpdate = true;
    morphProgress = 0;
    currentMode = name;
  }

  document.querySelectorAll('.pc-btn').forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });

  let mouseX = 0, mouseY = 0, targetRotX = 0, targetRotY = 0;
  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    targetRotX += (mouseY * 0.2 - targetRotX) * 0.03;
    targetRotY += (mouseX * 0.3 - targetRotY) * 0.03;
    pointCloud.rotation.x = targetRotX * 0.2;
    pointCloud.rotation.y = t * 0.03 + targetRotY * 0.3;

    const posAttr = geometry.attributes.position.array;
    if (morphProgress < 1) {
      morphProgress += 0.02;
      const p = Math.min(morphProgress, 1);
      const ease = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
      for (let i = 0; i < MAX_COUNT * 3; i++) {
        posAttr[i] = morphFrom[i] + (basePositions[i] - morphFrom[i]) * ease;
      }
    } else {
      if (currentMode === 'network') {
        for (let i = 0; i < activeCount; i++) {
          posAttr[i*3+1] += 0.01;
          if (posAttr[i*3+1] > 22) posAttr[i*3+1] = -22;
        }
      } else {
        for (let i = 0; i < activeCount; i++) {
          posAttr[i*3] = basePositions[i*3] + Math.sin(t + i*0.05) * 0.06;
        }
      }
    }
    geometry.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
